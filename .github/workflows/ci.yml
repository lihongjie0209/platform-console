name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - run: pnpm check:application-boundaries
      - run: pnpm check:application-chunks
      - run: pnpm check:application-scope
      - run: pnpm check:bounded-collections
      - run: pnpm check:product-surface
      - run: pnpm check:contracts
      - run: pnpm check:runtime-config

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: verify
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          load: true
          push: false
          tags: platform-console:ci
      - name: Verify non-root runtime configuration
        run: |
          docker run -d --name platform-console-ci \
            -e PLATFORM_IDENTITY_URL=https://identity.example.test \
            -e PLATFORM_TENANT_URL=https://tenant.example.test \
            -e PLATFORM_AUTHORIZATION_URL=https://authorization.example.test \
            -e PLATFORM_APPLICATION_URL=https://application.example.test \
            platform-console:ci
          for attempt in $(seq 1 20); do
            if docker exec platform-console-ci wget -qO /tmp/runtime-config.js http://127.0.0.1:8080/platform-config.js; then
              break
            fi
            sleep 1
          done
          docker exec platform-console-ci grep -q "identity: 'https://identity.example.test'" /tmp/runtime-config.js
          [ "$(docker inspect -f '{{.Config.User}}' platform-console-ci)" = "101" ]
      - if: always()
        run: docker rm -f platform-console-ci || true
